# Recovery template for janocaminho.com.br.
# Confirm the active production routing before replacing an existing config.

server {
  listen 80;
  server_name janocaminho.com.br www.janocaminho.com.br;
  return 301 https://www.janocaminho.com.br$request_uri;
}

server {
  listen 80;
  server_name chamanoespeto.com.br www.chamanoespeto.com.br;
  return 301 https://www.janocaminho.com.br$request_uri;
}

server {
  listen 443 ssl;
  server_name janocaminho.com.br www.janocaminho.com.br;

  ssl_certificate /etc/letsencrypt/live/janocaminho.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/janocaminho.com.br/privkey.pem;

  client_max_body_size 25m;

  location /api/maps/ {
    proxy_pass http://127.0.0.1:5000/api/maps/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Preserve the audited production behavior. Move all /api traffic to the BFF
  # only after validating every route in a controlled change.
  location /api/ {
    proxy_pass http://127.0.0.1:4000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://127.0.0.1:4000/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
