services:
  frontend:
    container_name: janocaminho-frontend
    image: "${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-edmilsonfernandes}/janocaminho-frontend:${IMAGE_TAG:-main}"
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: "${FRONTEND_BUILD_VERSION:-}"
        BUILD_GIT_SHA: "${FRONTEND_BUILD_GIT_SHA:-}"
        BUILD_GIT_SHORT_SHA: "${FRONTEND_BUILD_GIT_SHORT_SHA:-}"
        BUILD_GIT_BRANCH: "${FRONTEND_BUILD_GIT_BRANCH:-}"
        BUILD_GIT_REMOTE_URL: "${FRONTEND_BUILD_GIT_REMOTE_URL:-}"
        BUILD_TIME_ISO: "${FRONTEND_BUILD_TIME_ISO:-}"
        BUILD_COMMITS_B64: "${FRONTEND_BUILD_COMMITS_B64:-}"
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - apis
    restart: always

  backend:
    container_name: janocaminho-backend
    image: "${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-edmilsonfernandes}/janocaminho-backend:${IMAGE_TAG:-main}"
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.docker
    volumes:
      - edespetohub_uploads:/app/uploads
      - ./backend/keys:/app/keys:ro
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - face-worker
    restart: always

  face-worker:
    container_name: janocaminho-face-worker
    image: "${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-edmilsonfernandes}/janocaminho-face-worker:${IMAGE_TAG:-main}"
    build:
      context: ./face-worker
      dockerfile: Dockerfile
    environment:
      FACE_MODEL_NAME: "${FACE_MODEL_NAME:-buffalo_l}"
    restart: always

  postgres:
    container_name: janocaminho-postgres
    image: postgres:16
    environment:
      # Keep DB creds configurable so API+DB don't drift (common source of auth failures).
      # IMPORTANT: Changing POSTGRES_PASSWORD does NOT change an already-initialized volume password.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-espetinho}"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: always

  pgadmin:
    container_name: janocaminho-pgadmin
    image: dpage/pgadmin4:8.13
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@janocaminho.com.br
      PGADMIN_DEFAULT_PASSWORD: ChamaNoEspeto20025#!
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: always

  apis:
    container_name: janocaminho-apis
    image: "${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-edmilsonfernandes}/janocaminho-apis:${IMAGE_TAG:-main}"
    build:
      context: ./apis
      dockerfile: Dockerfile
    env_file:
      - ./apis/.env.docker
    ports:
      - "5000:5000"
    depends_on:
      - backend
    restart: always

volumes:
  postgres-data:
    name: "${POSTGRES_VOLUME_NAME:-edespetohub_postgres-data}"
  edespetohub_uploads:
    name: "${UPLOADS_VOLUME_NAME:-edespetohub_uploads_data}"
