version: "3.9"

services:
  frontend:
    container_name: chamanoespeto-frontend
    image: "${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-edmilsonfernandes}/edespetohub-frontend:${IMAGE_TAG:-main}"
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: "${FRONTEND_BUILD_VERSION:-}"
        BUILD_GIT_SHA: "${FRONTEND_BUILD_GIT_SHA:-}"
        BUILD_GIT_SHORT_SHA: "${FRONTEND_BUILD_GIT_SHORT_SHA:-}"
        BUILD_GIT_BRANCH: "${FRONTEND_BUILD_GIT_BRANCH:-}"
        BUILD_TIME_ISO: "${FRONTEND_BUILD_TIME_ISO:-}"
        BUILD_COMMITS_JSON: "${FRONTEND_BUILD_COMMITS_JSON:-}"
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api
      - maps
    restart: always

  api:
    container_name: chamanoespeto-api
    image: "${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-edmilsonfernandes}/edespetohub-api:${IMAGE_TAG:-main}"
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.docker
    volumes:
      - edespetohub_uploads:/app/uploads
      - ./backend/keys:/app/keys:ro
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - face-worker
    restart: always

  face-worker:
    container_name: chamanoespeto-face-worker
    image: "${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-edmilsonfernandes}/edespetohub-face-worker:${IMAGE_TAG:-main}"
    build:
      context: ./face-worker
      dockerfile: Dockerfile
    environment:
      FACE_MODEL_NAME: "${FACE_MODEL_NAME:-buffalo_l}"
    restart: always

  maps:
    container_name: chamanoespeto-maps
    image: "${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-edmilsonfernandes}/edespetohub-maps:${IMAGE_TAG:-main}"
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env.docker
    ports:
      - "5051:5050"
    restart: always

  postgres:
    container_name: chamanoespeto-postgres
    image: postgres:16
    environment:
      # Keep DB creds configurable so API+DB don't drift (common source of auth failures).
      # IMPORTANT: Changing POSTGRES_PASSWORD does NOT change an already-initialized volume password.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-espetinho}"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: always

  pgadmin:
    container_name: chamanoespeto-pgadmin
    image: dpage/pgadmin4:8.13
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@janocaminho.com.br
      PGADMIN_DEFAULT_PASSWORD: ChamaNoEspeto20025#!
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: always

volumes:
  postgres-data:
    # Pin volume name to avoid accidental "new empty DB" when compose project name/path changes.
    # Default matches the common compose-derived name for this repo.
    name: "${POSTGRES_VOLUME_NAME:-edespetohub_postgres-data}"
  edespetohub_uploads:
    name: "${UPLOADS_VOLUME_NAME:-edespetohub_uploads_data}"
