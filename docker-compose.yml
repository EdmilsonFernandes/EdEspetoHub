version: "3.9"

services:
  frontend:
    container_name: chamanoespeto-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - api
      - maps
    restart: always

  api:
    container_name: chamanoespeto-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.docker
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - face-worker
    restart: always

  face-worker:
    container_name: chamanoespeto-face-worker
    build:
      context: ./face-worker
      dockerfile: Dockerfile
    environment:
      FACE_DETECTOR_BACKEND: "${FACE_DETECTOR_BACKEND:-opencv}"
      FACE_MODEL_NAME: "${FACE_MODEL_NAME:-VGG-Face}"
    restart: always

  maps:
    container_name: chamanoespeto-maps
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env.docker
    ports:
      - "5051:5050"
    restart: always

  postgres:
    container_name: chamanoespeto-postgres
    image: postgres:16
    environment:
      # Keep DB creds configurable so API+DB don't drift (common source of auth failures).
      # IMPORTANT: Changing POSTGRES_PASSWORD does NOT change an already-initialized volume password.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-espetinho}"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: always

  pgadmin:
    container_name: chamanoespeto-pgadmin
    image: dpage/pgadmin4:8.13
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@chamanoespeto.com
      PGADMIN_DEFAULT_PASSWORD: ChamaNoEspeto20025#!
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: always

volumes:
  postgres-data:
    # Pin volume name to avoid accidental "new empty DB" when compose project name/path changes.
    # Default matches the common compose-derived name for this repo.
    name: "${POSTGRES_VOLUME_NAME:-edespetohub_postgres-data}"
