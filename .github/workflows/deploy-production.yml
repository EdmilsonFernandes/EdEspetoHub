name: Deploy to EC2 (Approval)

on:
  workflow_run:
    workflows: ["Publish Docker Images (GHCR)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag da imagem no GHCR (main ou SHA curta)"
        required: false
        default: "main"
      deploy_scope:
        description: "Quais serviços publicar em produção"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - frontend
          - backend
          - apis
          - face-worker
          - backend+frontend
          - backend+apis
          - all

concurrency:
  group: deploy-production-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.release.outputs.image_tag }}
      source_run_url: ${{ steps.release.outputs.source_run_url }}
      trigger_label: ${{ steps.release.outputs.trigger_label }}
      has_services: ${{ steps.services.outputs.has_services }}
      services: ${{ steps.services.outputs.services }}
      services_display: ${{ steps.services.outputs.services_display }}
      requested_scope: ${{ steps.services.outputs.requested_scope }}

    steps:
      - name: Resolve release
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            head_sha="${{ github.event.workflow_run.head_sha }}"
            image_tag="${head_sha::8}"
            source_run_url="${{ github.event.workflow_run.html_url }}"
            trigger_label="workflow_run"
          else
            image_tag="${{ inputs.image_tag }}"
            source_run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            trigger_label="workflow_dispatch"
          fi

          if [ -z "$image_tag" ]; then
            image_tag="main"
          fi

          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "source_run_url=$source_run_url" >> "$GITHUB_OUTPUT"
          echo "trigger_label=$trigger_label" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        shell: bash
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Production deployment

          - Trigger: \`${{ steps.release.outputs.trigger_label }}\`
          - Image tag: \`${{ steps.release.outputs.image_tag }}\`
          - Source workflow: ${{ steps.release.outputs.source_run_url }}
          - Target host: production EC2
          EOF

      - name: Resolve deploy services
        id: services
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          DEPLOY_SCOPE: ${{ inputs.deploy_scope }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          requested_scope="$DEPLOY_SCOPE"
          if [ -z "$requested_scope" ]; then
            requested_scope="auto"
          fi

          case "$requested_scope" in
            frontend)
              services="frontend"
              ;;
            backend)
              services="backend"
              ;;
            apis)
              services="apis"
              ;;
            face-worker)
              services="face-worker"
              ;;
            backend+frontend)
              services="backend frontend"
              ;;
            backend+apis)
              services="backend apis"
              ;;
            all)
              services="backend apis frontend face-worker"
              ;;
            auto)
              if [ "$EVENT_NAME" = "workflow_run" ] && [ -n "${SOURCE_RUN_ID:-}" ]; then
                services="$(
                  curl -fsSL \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/${GH_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100" |
                  jq -r '
                    .jobs[]
                    | select(.conclusion == "success")
                    | .name
                    | capture("^build-and-push \\((?<service>[^,]+),").service
                  ' |
                  awk '!seen[$0]++' |
                  paste -sd" " -
                )"
              else
                printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null

                services=""
                for attempt in 1 2 3 4 5 6; do
                  services=""
                  for service in backend apis frontend face-worker; do
                    case "$service" in
                      backend) image="janocaminho-backend" ;;
                      apis) image="janocaminho-apis" ;;
                      frontend) image="janocaminho-frontend" ;;
                      face-worker) image="janocaminho-face-worker" ;;
                    esac

                    image_ref="ghcr.io/${GH_REPOSITORY_OWNER}/${image}:${IMAGE_TAG}"
                    if docker manifest inspect "$image_ref" >/dev/null 2>&1; then
                      if [ -n "$services" ]; then
                        services="$services "
                      fi
                      services="${services}${service}"
                    fi
                  done

                  if [ -n "$services" ] || [ "$attempt" -eq 6 ]; then
                    break
                  fi

                  echo "No deployable image found yet for tag ${IMAGE_TAG}. Retrying in 10s (attempt ${attempt}/6)..."
                  sleep 10
                done
              fi
              ;;
            *)
              echo "Unsupported deploy_scope: $requested_scope" >&2
              exit 1
              ;;
          esac

          if [ -n "$services" ]; then
            echo "has_services=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_services=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$services" ]; then
            services_display="$services"
          else
            services_display="none"
          fi
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "services_display=$services_display" >> "$GITHUB_OUTPUT"
          echo "requested_scope=$requested_scope" >> "$GITHUB_OUTPUT"

      - name: Write service summary
        shell: bash
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"

          - Deploy scope: \`${{ steps.services.outputs.requested_scope }}\`
          - Services: \`${{ steps.services.outputs.services_display }}\`
          EOF

      - name: Skip deploy when no image changed
        if: steps.services.outputs.has_services != 'true'
        shell: bash
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"

          No published image found for the requested tag/scope.
          This workflow finished without creating a production approval gate.
          EOF

  deploy:
    needs: resolve
    if: needs.resolve.outputs.has_services == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.janocaminho.com.br

    steps:
      - name: Prepare SSH
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          if [ -z "${PROD_SSH_HOST:-}" ]; then
            echo "Missing required GitHub environment secret: PROD_SSH_HOST" >&2
            exit 1
          fi

          if [ -z "${PROD_SSH_KEY:-}" ]; then
            echo "Missing required GitHub environment secret: PROD_SSH_KEY" >&2
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PROD_SSH_PORT:-22}" -H "$PROD_SSH_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH access
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          ssh_user="${PROD_SSH_USER:-ec2-user}"
          ssh_port="${PROD_SSH_PORT:-22}"

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$ssh_port" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            "${ssh_user}@${PROD_SSH_HOST}" \
            "echo github-actions-ssh-ok"

      - name: Write approved deploy summary
        shell: bash
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Approved production deployment

          - Trigger: \`${{ needs.resolve.outputs.trigger_label }}\`
          - Image tag: \`${{ needs.resolve.outputs.image_tag }}\`
          - Source workflow: ${{ needs.resolve.outputs.source_run_url }}
          - Deploy scope: \`${{ needs.resolve.outputs.requested_scope }}\`
          - Services: \`${{ needs.resolve.outputs.services_display }}\`
          - Target host: production EC2
          EOF

      - name: Deploy on EC2
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          SERVICES: ${{ needs.resolve.outputs.services }}
        run: |
          ssh_user="${PROD_SSH_USER:-ec2-user}"
          ssh_port="${PROD_SSH_PORT:-22}"

          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$ssh_port" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            "${ssh_user}@${PROD_SSH_HOST}" \
            "set -eu; \
             cd ~/EdEspetoHub; \
             git pull --ff-only; \
             scripts/./deploy-release.sh '$IMAGE_TAG' $SERVICES"

      - name: Capture deployed versions
        if: success()
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          ssh_user="${PROD_SSH_USER:-ec2-user}"
          ssh_port="${PROD_SSH_PORT:-22}"

          versions=$(ssh \
            -i ~/.ssh/id_ed25519 \
            -p "$ssh_port" \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o StrictHostKeyChecking=yes \
            "${ssh_user}@${PROD_SSH_HOST}" \
            "docker exec janocaminho-frontend cat /usr/share/nginx/html/build-info.json 2>/dev/null | grep -E 'versionLabel|shortHash|builtAt' | head -3; echo '---'; docker exec janocaminho-backend node -e \"try{const p=require('./package.json');console.log('backend:',p.version)}catch{}\" 2>/dev/null" || echo "Could not fetch versions")

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"

          ## Deployed versions

          \`\`\`
          $versions
          \`\`\`
          EOF
