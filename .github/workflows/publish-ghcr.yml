name: Publish Docker Images (GHCR)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_scope:
        description: "Quais imagens publicar"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - frontend
          - backend
          - apis
          - face-worker
          - backend+frontend
          - backend+apis
          - all

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DOCKER_METADATA_SHORT_SHA_LENGTH: 8

jobs:
  detect-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_targets: ${{ steps.detect.outputs.has_targets }}
      services: ${{ steps.detect.outputs.services }}
      services_display: ${{ steps.detect.outputs.services_display }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect publish targets
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_SCOPE: ${{ inputs.build_scope }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ -z "${BUILD_SCOPE:-}" ]; then
            BUILD_SCOPE="auto"
          fi

          frontend_changed=false
          api_changed=false
          apis_changed=false
          face_worker_changed=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$BUILD_SCOPE" in
              ""|auto|all)
                frontend_changed=true
                api_changed=true
                apis_changed=true
                face_worker_changed=true
                ;;
              frontend)
                frontend_changed=true
                ;;
              backend)
                api_changed=true
                ;;
              apis)
                apis_changed=true
                ;;
              face-worker)
                face_worker_changed=true
                ;;
              backend+frontend)
                api_changed=true
                frontend_changed=true
                ;;
              backend+apis)
                api_changed=true
                apis_changed=true
                ;;
              *)
                echo "Unsupported build_scope: $BUILD_SCOPE" >&2
                exit 1
                ;;
            esac
          else
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              frontend_changed=true
              api_changed=true
              apis_changed=true
              face_worker_changed=true
            else
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"

              if printf '%s\n' "$changed_files" | grep -Eq '^frontend/'; then
                frontend_changed=true
              fi

              if printf '%s\n' "$changed_files" | grep -Eq '^backend/'; then
                api_changed=true
              fi

              if printf '%s\n' "$changed_files" | grep -Eq '^apis/'; then
                apis_changed=true
              fi

              if printf '%s\n' "$changed_files" | grep -Eq '^face-worker/'; then
                face_worker_changed=true
              fi
            fi
          fi

          FRONTEND_CHANGED="$frontend_changed" \
          API_CHANGED="$api_changed" \
          APIS_CHANGED="$apis_changed" \
          FACE_WORKER_CHANGED="$face_worker_changed" \
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          changed = {
              "frontend": os.environ.get("FRONTEND_CHANGED") == "true",
              "backend": os.environ.get("API_CHANGED") == "true",
              "apis": os.environ.get("APIS_CHANGED") == "true",
              "face-worker": os.environ.get("FACE_WORKER_CHANGED") == "true",
          }

          service_order = ["backend", "apis", "frontend", "face-worker"]
          services = [name for name in service_order if changed[name]]

          config = {
              "backend": {
                  "name": "backend",
                  "context": "./backend",
                  "dockerfile": "./backend/Dockerfile",
                  "image": "janocaminho-backend",
              },
              "apis": {
                  "name": "apis",
                  "context": "./apis",
                  "dockerfile": "./apis/Dockerfile",
                  "image": "janocaminho-apis",
              },
              "frontend": {
                  "name": "frontend",
                  "context": "./frontend",
                  "dockerfile": "./frontend/Dockerfile",
                  "image": "janocaminho-frontend",
              },
              "face-worker": {
                  "name": "face-worker",
                  "context": "./face-worker",
                  "dockerfile": "./face-worker/Dockerfile",
                  "image": "janocaminho-face-worker",
              },
          }

          matrix = [config[name] for name in services]
          services_display = " ".join(services) if services else "none"

          print(f"matrix={json.dumps(matrix, separators=(',', ':'))}")
          print(f"has_targets={'true' if services else 'false'}")
          print(f"services={' '.join(services)}")
          print(f"services_display={services_display}")
          PY

  build-and-push:
    needs: detect-targets
    if: needs.detect-targets.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-targets.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short,prefix=

      - name: Prepare image build metadata
        id: image_meta
        run: |
          VERSION=""
          if [ -f "${{ matrix.context }}/package.json" ]; then
            VERSION="$(node -p "require('${{ matrix.context }}/package.json').version")"
          fi
          SHORT_SHA="${GITHUB_SHA::8}"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          DATE_PART="${BUILD_TIME:0:10}"
          DATE_PART="${DATE_PART//-/}"
          TIME_PART="${BUILD_TIME:11:8}"
          TIME_PART="${TIME_PART//:/}"

          if [ -n "$VERSION" ]; then
            VERSION_LABEL="v${VERSION}.${GITHUB_RUN_NUMBER}"
            VERSION_INTERNAL="${VERSION}+gha.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
          else
            VERSION_LABEL="${{ matrix.name }}"
            VERSION_INTERNAL="${{ matrix.name }}+gha.${GITHUB_RUN_NUMBER}.${SHORT_SHA}"
          fi
          BUILD_ID="${VERSION_INTERNAL}-${DATE_PART}.${TIME_PART}-${SHORT_SHA}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_label=${VERSION_LABEL}" >> "$GITHUB_OUTPUT"
          echo "version_internal=${VERSION_INTERNAL}" >> "$GITHUB_OUTPUT"
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "build_version=${VERSION_INTERNAL}" >> "$GITHUB_OUTPUT"
          echo "build_git_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_git_short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_git_branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_git_remote_url=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "build_time_iso=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: Prepare frontend build metadata
        if: matrix.name == 'frontend'
        id: frontend_meta
        run: |
          echo "build_version=${{ steps.image_meta.outputs.build_version }}" >> "$GITHUB_OUTPUT"
          echo "build_git_sha=${{ steps.image_meta.outputs.build_git_sha }}" >> "$GITHUB_OUTPUT"
          echo "build_git_short_sha=${{ steps.image_meta.outputs.build_git_short_sha }}" >> "$GITHUB_OUTPUT"
          echo "build_git_branch=${{ steps.image_meta.outputs.build_git_branch }}" >> "$GITHUB_OUTPUT"
          echo "build_git_remote_url=${{ steps.image_meta.outputs.build_git_remote_url }}" >> "$GITHUB_OUTPUT"
          echo "build_time_iso=${{ steps.image_meta.outputs.build_time_iso }}" >> "$GITHUB_OUTPUT"

          git log -n 30 --date=iso-strict --pretty=format:'%H|%h|%cI|%an|%ae|%s' > /tmp/frontend-commits.txt
          COMMITS_B64="$(
          python3 - <<'PY'
          import base64
          import json

          rows = []
          with open('/tmp/frontend-commits.txt', 'r', encoding='utf-8') as handle:
              for line in handle:
                  parts = line.rstrip('\n').split('|')
                  if len(parts) < 6:
                      continue
                  rows.append({
                      "hash": parts[0],
                      "shortHash": parts[1],
                      "dateIso": parts[2],
                      "authorName": parts[3],
                      "authorEmail": parts[4],
                      "subject": "|".join(parts[5:]).strip(),
                  })

          payload = json.dumps(rows, ensure_ascii=True, separators=(',', ':')).encode('utf-8')
          print(base64.b64encode(payload).decode('ascii'))
          PY
          )"
          echo "build_commits_b64=${COMMITS_B64}" >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            io.janocaminho.build.version=${{ steps.image_meta.outputs.version }}
            io.janocaminho.build.version_label=${{ steps.image_meta.outputs.version_label }}
            io.janocaminho.build.version_internal=${{ steps.image_meta.outputs.version_internal }}
            io.janocaminho.build.build_id=${{ steps.image_meta.outputs.build_id }}
            io.janocaminho.build.commit_sha=${{ steps.image_meta.outputs.build_git_sha }}
            io.janocaminho.build.short_sha=${{ steps.image_meta.outputs.build_git_short_sha }}
            io.janocaminho.build.branch=${{ steps.image_meta.outputs.build_git_branch }}
            io.janocaminho.build.time_iso=${{ steps.image_meta.outputs.build_time_iso }}
          build-args: |
            BUILD_VERSION=${{ steps.frontend_meta.outputs.build_version }}
            BUILD_GIT_SHA=${{ steps.frontend_meta.outputs.build_git_sha }}
            BUILD_GIT_SHORT_SHA=${{ steps.frontend_meta.outputs.build_git_short_sha }}
            BUILD_GIT_BRANCH=${{ steps.frontend_meta.outputs.build_git_branch }}
            BUILD_GIT_REMOTE_URL=${{ steps.frontend_meta.outputs.build_git_remote_url }}
            BUILD_TIME_ISO=${{ steps.frontend_meta.outputs.build_time_iso }}
            BUILD_COMMITS_B64=${{ steps.frontend_meta.outputs.build_commits_b64 }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  publish-summary:
    needs: detect-targets
    runs-on: ubuntu-latest
    steps:
      - name: Write publish summary
        shell: bash
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Publish targets

          - Services: \`${{ needs.detect-targets.outputs.services_display }}\`
          - Has targets: \`${{ needs.detect-targets.outputs.has_targets }}\`
          EOF
