server {
  listen 80;

  # build do React
  root /usr/share/nginx/html;
  index index.html;

  # Entradas de atualização do app nunca podem ficar imutáveis no WebView/PWA.
  # Se o index ou o service worker envelhecem após deploy, o app pode tentar abrir chunks removidos.
  location = /index.html {
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  location = /sw.js {
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  location ~* ^/(?:workbox-[^/]+\.js|manifest\.json|build-info\.json)$ {
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  # Cache forte para assets estáticos versionados e imagens de marketing.
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|avif|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # SPA (React) - front
  location / {
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # Proxy para API
  location /api/ {
    proxy_pass http://apis:5000/api/;
    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Proxy para geocoding/rota pelo backend principal
  location /api/maps/ {
    proxy_pass http://apis:5000/api/maps/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Cache forte para uploads publicos versionados por nome unico.
  location ~* ^/uploads/(?:products|logos|condominiums|destinations|payment)/ {
    proxy_pass http://backend:4000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header Cache-Control;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  # Proxy para uploads (logos e imagens)
  location /uploads/ {
    proxy_pass http://backend:4000/uploads/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }
}
