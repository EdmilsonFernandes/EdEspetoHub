server {
  listen 80;

  # build do React
  root /usr/share/nginx/html;
  index index.html;

  # Entradas de atualização do app nunca podem ficar imutáveis no WebView/PWA.
  # Se o index ou o service worker envelhecem após deploy, o app pode tentar abrir chunks removidos.
  location = /index.html {
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  location = /sw.js {
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  location ~* ^/(?:workbox-[^/]+\.js|manifest\.json|build-info\.json)$ {
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  # Cache forte para assets estáticos versionados e imagens de marketing.
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|avif|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # SPA (React) - front
  location / {
    expires off;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # ── Redirects permanentes de slug de loja (21/08) ──────────────────────────
  # 308 preserva método+body: links antigos no WhatsApp/Google/QR impresso E
  # drafts de checkout no localStorage (que chamam a API pelo slug velho)
  # continuam funcionando. Adicionar ANTES de trocar o slug no banco.
  location = /edsertaneja {
    return 308 /espetinho-datony-bacabal$is_args$args;
  }
  # Paths reais do app: /api/stores/slug/:slug (vitrine/produtos/postal) e
  # /api/public/stores/slug/:slug (track/reviews/produtos publicos).
  location ~ ^/api/(public/)?stores/slug/edsertaneja(/.*)?$ {
    return 308 /api/$1stores/slug/espetinho-datony-bacabal$2$is_args$args;
  }

  # Proxy para API
  location /api/ {
    proxy_pass http://apis:5000/api/;
    client_max_body_size 5m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Proxy para geocoding/rota pelo backend principal
  location /api/maps/ {
    proxy_pass http://apis:5000/api/maps/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Proxy para uploads publicos (imagens/logos/banners). O modificador ^~ dá
  # prioridade sobre a regex de assets estaticos acima: sem isso, um request
  # /uploads/destinations/x.jpeg caía no "try_files =404" (o arquivo não existe
  # no container do front, só no backend) e devolvia 404.
  location ^~ /uploads/ {
    proxy_pass http://backend:4000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_hide_header Cache-Control;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }
}
